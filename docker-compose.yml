version: '3.8'

services:
  api:
    build: .
    container_name: sigeh_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sigeh_admin:admin123@db:5432/sigeh_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: sigeh_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sigeh_admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=sigeh_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: